apiVersion: v2
name: modux
description: >-
  Modux — model-driven editor & generator. Despliega la app junto a su base de
  datos PostgreSQL (subchart de Bitnami, desactivable para usar una BD externa).
type: application
version: 0.1.0
appVersion: "0.0.1"
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
