org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true

# Build against a local IDEA install instead of downloading a whole SDK — much faster, and it is
# what a developer already has. It is a path on YOUR machine, so it does not belong in a file that
# travels: put it in ~/.gradle/gradle.properties, which takes precedence over this one.
#
#     moduxIdeaLocalPath=/home/you/idea-IU-252.28238.7
#
# Leave it unset and the build downloads IntelliJ Community instead, which is what CI and a fresh
# clone do.
