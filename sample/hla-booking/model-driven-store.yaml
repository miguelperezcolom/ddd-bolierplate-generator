useCases:
# D11 — cada servicio de dominio expone UI · gRPC · MCP sobre el mismo core
- id: "uc-book"
  name: "BookHotel"
  exposedAsGrpc: true
  exposedAsMcp: true
  exposedAsUi: true
  inputModelId: "model-book-input"
  outputModelId: "model-reserva"
  # D9: re-valida el quote-token re-preciando contra valoración (cruza servicio → API gRPC, D10)
  steps:
  - id: "step-book-revalorar"
    name: "ReValorarQuoteToken"
    type: "CallQueryService"
    queryServiceId: "qs-valoracion"
    queryOperationId: "qop-getHotelPriceDetails"
  transactionBoundary: "LOCAL"
  idempotencyEnabled: true
  idempotencyKeyField: "bookingReference"
  grpcServiceName: "Reservas"
  grpcMethodName: "Book"
  decisionIds: ["d5", "d9", "d11"]
- id: "uc-getBooking"
  name: "GetBooking"
  exposedAsGrpc: true
  exposedAsMcp: true
  exposedAsUi: true
  outputModelId: "model-reserva"
  cacheable: false
  grpcServiceName: "Reservas"
  grpcMethodName: "Get"
- id: "uc-cancelBooking"
  name: "CancelBooking"
  exposedAsGrpc: true
  exposedAsMcp: true
  exposedAsUi: true
  transactionBoundary: "LOCAL"
  idempotencyEnabled: true
  idempotencyKeyField: "bookingId"
  grpcServiceName: "Reservas"
  grpcMethodName: "Cancel"
# Internos (los invoca la saga; async por outbox, D3/D10)
- id: "uc-confirmReservation"
  name: "ConfirmReservation"
  exposedAsAsync: true
  idempotencyEnabled: true
  idempotencyKeyField: "bookingId"
- id: "uc-failReservation"
  name: "FailReservation"
  exposedAsAsync: true
  idempotencyEnabled: true
  idempotencyKeyField: "bookingId"
- id: "uc-rejectReservation"
  name: "RejectReservation"
  exposedAsAsync: true
  idempotencyEnabled: true
  idempotencyKeyField: "bookingId"
# §7 reconciliación — por si Forms toca la reserva por detrás
- id: "uc-reconciliar"
  name: "ReconciliarConRumbo"
  exposedAsUi: true
# Worker ACL (D4/D5) — clave idempotente reservationId:{paso}
# Implementación CUSTOM (el desarrollador escribe la llamada a sp_book_reservation)
- id: "uc-bookFolio"
  name: "BookFolio"
  exposedAsAsync: true
  idempotencyEnabled: true
  idempotencyKeyField: "reservationId"
  decisionIds: ["d4", "d5", "d12"]

# El read side de valoración expone su API (la consume reservas cruzando servicio — D9/D10)
queryServices:
- id: "qs-valoracion"
  name: "Valoracion"
  moduleId: "mod-valoracion"
  description: "Oferta preciada: rateId por estancia + suplementos seleccionables (getRates / getHotelPriceDetails)."
  exposedAsGrpc: true
  operations:
  - id: "qop-getHotelPriceDetails"
    name: "getHotelPriceDetails"
    description: "Re-invocable: precio firme + detalle + forma de pago para una selección."
    inputModelId: "model-book-input"
    outputModelId: "model-reserva"
    cardinality: "Single"

roles:
- id: "bookingOps"
  name: "Operaciones de reservas"
  allowedUseCaseIds:
  - "uc-getBooking"
  - "uc-rejectReservation"
  - "uc-reconciliar"
- id: "jefeOperaciones"
  name: "Jefe de operaciones"
  allowedUseCaseIds:
  - "uc-getBooking"
  - "uc-rejectReservation"
  - "uc-cancelBooking"
  - "uc-reconciliar"

scheduledTriggers:
- id: "st-reconciliador"
  name: "Reconciliador reservas-rumbo"
  cronExpression: "0 0 * * * *"
  useCaseId: "uc-reconciliar"
  description: "§7: reconcilia reservas ↔ rumbo por si Forms modifica la reserva por detrás del CDC."
  retryOnFailure: true
  retryCount: 3

# ============================================================================
# CAPA DE INTENCIÓN
# ============================================================================

processes:
# D3/D6 — la saga de grabación, declarada como proceso de negocio (sin hold, D12·A)
- id: "grabar-reserva"
  name: "GrabarReserva"
  description: "§5.1: book → confirm, orquestado (EventConductor). El pending de la agencia (ONREQUEST) se resuelve al completar."
  triggerAggregateId: "agg-reserva"
  triggerEvent: "ReservationRequested"
  ownerModuleId: "mod-reservas"
  sla: "PT1H"
  decisionIds: ["d3", "d6", "d12"]
  # D12 resuelto por negocio: SIN hold — el book atómico es toda la escritura (opción A)
  steps:
  - id: "step-book"
    name: "BookFolio"
    type: "AUTOMATED"
    useCaseId: "uc-bookFolio"
    description: "Check de allotment + decremento + folio, atómico en Oracle (D12·A). Sin compensación — es el único paso de escritura; si falla, el pending pasa a Rejected/Failed."
  - id: "step-confirm"
    name: "ConfirmarReserva"
    type: "AUTOMATED"
    useCaseId: "uc-confirmReservation"
    description: "Confirmed + outbox ReservationConfirmed; la agencia ve OK en getBooking."
  onCompletionEventName: "GrabacionReservaCompletada"

# Operativa — rechazos y fallos pasan por revisión humana antes de responder a la agencia
- id: "revisar-fallo-reserva"
  name: "RevisarFalloReserva"
  description: "Cuando la grabación falla, operaciones revisa el caso — puede relanzar (re-drive idempotente, D5) o rechazar definitivamente."
  triggerAggregateId: "agg-reserva"
  triggerEvent: "ReservationFailed"
  ownerModuleId: "mod-reservas"
  sla: "P1D"
  decisionIds: ["d5"]
  steps:
  - id: "step-revisar"
    name: "RevisarReservaFallida"
    type: "HUMAN"
    roleId: "bookingOps"
    deadline: "PT4H"
    escalationRoleId: "jefeOperaciones"
    description: "Bandeja de operaciones: decidir relanzar la saga o rechazar."
  - id: "step-notificar-rechazo"
    name: "NotificarRechazo"
    type: "AUTOMATED"
    useCaseId: "uc-rejectReservation"
  onCompletionEventName: "FalloReservaResuelto"

flows:
# La agencia puede recibir callback al confirmarse (además del polling getBooking)
- id: "notificar-agencia-confirmacion"
  name: "NotificarAgenciaConfirmacion"
  description: "Callback OUTBOUND a la agencia al confirmarse la reserva."
  archetype: "NOTIFIES"
  triggerAggregateId: "agg-reserva"
  triggerEvent: "ReservationConfirmed"
  targetModuleId: "ext-agencia-callback"
  materializedFields:
  - "bookingId"
  - "locator"
  - "status"
  - "holderEmail"   # ⚠ deliberado: PII cruzando la frontera — el linter debe avisar
