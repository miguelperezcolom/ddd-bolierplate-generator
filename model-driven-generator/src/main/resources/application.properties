spring.application.name=model-driven-generator
server.port=8192
# Static assets (editor bundle included) revalidate on every load: without this the
# browser caches them heuristically and a rebuilt modux-editor.js needs a hard reload.
spring.web.resources.cache.cachecontrol.no-cache=true

# El agente del chat (pseudoagente CLI de mateu) recibe el MCP de la PROPIA app:
# mismo proceso, mismo catálogo en memoria que las UIs abiertas.
mateu.agent.cli.mcp-config={"mcpServers":{"modux":{"type":"http","url":"http://localhost:${server.port:8192}/mcp"}}}
mateu.agent.cli.allowed-tools=mcp__modux
